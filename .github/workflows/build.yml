name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Use the runner's preinstalled Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Unit tests (RTP math)
        run: gradle :app:testDebugUnitTest --tests "*RtpTest*" :reaper:testDebugUnitTest --tests "*CalibrationTest.lineRules*" --tests "*CalibrationTest.payouts*"
      - name: Build release APK
        run: gradle :app:assembleRelease :reaper:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: casino-apks
          path: |
            app/build/outputs/apk/release/app-release.apk
            reaper/build/outputs/apk/release/reaper-release.apk
